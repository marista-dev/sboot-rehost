# fixers/registry.yaml - maps a fault name to the fixer that owns it.
#
# fault-classifier names the stop point and then looks the owner up here.
# The pipeline only reads this file, so **adding a fixer is one agent file plus a
# few lines here** - the orchestration code never changes.
#
# Rules
#   - One fault may list several candidate owners; fault-classifier ranks them.
#     Only the top-ranked fixer runs in a given round (one round, one change).
#   - **A fault that is not listed here goes to no fixer at all.** It goes to
#     static-analyzer for derivation. There is deliberately no catch-all fixer,
#     because a wrong guess here produces something that boots plausibly but is
#     fake (honesty rule 1).
#
# The split is by **owned faults plus the tools used**, not by layer or track.
# smc_undef shows up on both tracks, but the repair is identical, so fixer-el3
# owns it alone.

version: 1

fixers:
  fixer-memory:
    description: memory map and peripheral windows
    handles: [data_abort_unmapped, infinite_poll, unmapped_mmio, cpu_cluster_mpidr]
    knowledge: [knowledge/faults_unified.md]
    tools: [fdtdump, grep]
    edits: [machine_full.c]

  fixer-el3:
    description: EL3 and exception levels (SMC / PSCI / HVC / FP trap)
    handles: [smc_undef, psci_suspend, hvc_pkvm, fpu_trap]
    knowledge: [knowledge/faults_unified.md]
    tools: [capstone]
    edits: [machine_full.c]

  fixer-bootflow:
    description: chain control flow (stage handoff / console routing / getline timeout / shell mode gate)
    handles: [null_ret, console_silent, shell_exit_early, shell_mode_gate,
              handoff_slot_missing, stage_handoff_missing]
    knowledge: [knowledge/faults_unified.md]
    tools: [capstone]
    edits: [machine_full.c]

  fixer-kernel:
    description: kernel .text patches, GIC wiring, rootfs path
    handles: [security_gate, kernel_oops, gic_ppi, rootfs_mount]
    knowledge: [knowledge/faults_unified.md, knowledge/kernel_gates.md]
    tools: [capstone, fdtdump, patch_kernel.py]
    edits: [machine_full.c, patch_kernel.py]

  fixer-storage:
    description: vendor storage HCI model, UPIU fields, documented .ko bypasses
    handles:
      - poll_stall
      - desc_addr_corrupt
      - prdt_stride
      - irq_edge_level
      - is_bit_layout
      - query_upiu_overwrite
      - sparse_super_gpt
      - pwrmode_timeout
      - gear_source
      - upiu_field_off
      - block_size
      - vendor_telemetry_null
      # The medium is modelled in the unified flow, so a missing partition table
      # or key store is a defect in what we synthesised - not a track boundary.
      - partition_table_unavailable
      - keystore_partition_missing
    knowledge: [knowledge/faults_unified.md, knowledge/faults_storage.md]
    tools: [readelf, objdump, capstone, build_lu.py]
    edits: [storage_hci.c, machine_full.c, build_lu.py]

  fixer-secureboot:
    description: the bootloader's own verified boot (AVB / vbmeta / rollback index / key store)
    handles: [avb_verify_fail, rollback_index_unavailable]
    knowledge: [knowledge/faults_unified.md]
    tools: [capstone, avbtool, build_lu.py]
    edits: [machine_full.c, build_lu.py]

# No owner -> static-analyzer. There is no fallback fixer by design.
unmapped_policy: escalate_to_static_analyzer

# Named faults that belong to no fixer because they are not about the firmware.
# Ranking one would spend a round repairing a fault that does not exist.
#   harness_input_starved  the gate polled the console and read none of our bytes,
#                          so the surface was never offered its input. The pipeline
#                          re-runs the round; if it persists, the gate's derived
#                          contiguous / empty_poll_budget are what to question.
#   partition_table_unavailable
#                          downstream failure (environment, panel, modem, next
#                          stage) follows from that one fact. The pipeline records
not_firmware: [harness_input_starved]

# --- Build-layer stop points --------------------------------------------
# A fixer changes one place in sources that exist; it cannot change a premise the
# machine was BUILT on. Ranking one here would spend a round producing a band-aid
# that changes nothing, which is what a run of identical fingerprints looks like.
# These route to `supervisor` -> rebuild with a concrete premise correction, and
# `stage_map.json` is the record of the premises to correct.
#   stage_entry_el_mismatch  the stage was entered at an exception level it was
#                            not built for. Derive the level from which vbar_el*
#                            the stage's OWN entry stub writes - never default.
#   stage_decrypt_blocked    the run reached a decrypt routine for a stage that
#                            cannot execute here. The skip redirect is missing or
#                            points at the wrong stage.
build_layer: [stage_entry_el_mismatch, stage_decrypt_blocked]

# --- When to split a fixer further ---------------------------------------
# Guessing the split up front gets it wrong. Decide from the data that
# accumulates in rounds.jsonl:
#   - one fixer owns more than ~10 faults      -> the prompt bloats and loses focus
#   - the tools diverge inside one fixer       -> it is really two jobs
#   - a fault recurs across many firmwares     -> specialising it pays off
#   - one fault has a notably low success rate -> break it out and go deeper

# Last resort - never ranked by the classifier. The pipeline reaches it only
# after a specialist declined (not_mine or no_new_change), which means the stop
# point has no owner yet. It has no domain boundary and may edit, build and run,
# so a mechanism that crosses what the domains split apart can be treated in one
# round. In exchange it records each case in <workdir>/fixer_candidates.md so a
# real specialist can be written and committed later.
#
# Promotion is deliberate: the agent registry is a snapshot taken at session
# start, so an agent file written at runtime is not loadable in that run.
  fixer-general:
    description: last resort, no domain boundary; edits any machine source, builds and runs
    handles: [unowned]
    knowledge: [knowledge/faults_unified.md, knowledge/faults_storage.md, knowledge/kernel_gates.md]
    tools: [capstone, ninja, qemu]
    edits: [any]
    reached_by: decline_only
